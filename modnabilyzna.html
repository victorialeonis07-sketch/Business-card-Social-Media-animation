*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--f-ui);
  min-height:100%;
  display:grid;place-items:center;
  padding:24px 16px;
  overflow-x:hidden;
  position:relative;
}
/* мягкое свечение сцены */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(60% 50% at 50% 42%,rgba(255,255,255,.05),transparent 70%);
}

/* ---------- фон из векторных рисунков ---------- */
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.bg i{
  position:absolute;display:block;
  width:var(--w);aspect-ratio:var(--ar);
  left:var(--x);top:var(--y);
  background:var(--img) center/contain no-repeat;
  opacity:var(--o,.16);
  filter:drop-shadow(0 0 6px rgba(255,255,255,.35));
  transform:translate3d(calc(var(--px,0)*var(--d)),calc(var(--py,0)*var(--d)),0) rotate(var(--r));
  animation:drift var(--t) ease-in-out infinite alternate;
}
@keyframes drift{
  from{margin-top:-8px}
  to{margin-top:10px}
}

/* ---------- карточка ---------- */
.stage{position:relative;perspective:1100px;width:100%;max-width:420px}
.card{
  position:relative;
  padding:34px 26px 28px;
  background:linear-gradient(160deg,rgba(10,10,10,.9),rgba(2,2,2,.96));
  border:1.5px solid rgba(255,255,255,.9);
  border-radius:26px;
  box-shadow:
    0 0 0 4px rgba(255,255,255,.05),
    0 0 14px rgba(255,255,255,.55),
    0 0 42px rgba(255,255,255,.22),
    inset 0 0 22px rgba(255,255,255,.07);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
  transition:transform .25s ease-out;
  text-align:center;
}
.card::after{ /* внутренняя тонкая рамка */
  content:"";position:absolute;inset:7px;border-radius:20px;
  border:1px solid rgba(255,255,255,.22);pointer-events:none;
}

.crest{
  width:100%;aspect-ratio:760/197;margin-bottom:14px;
  background:var(--logo) center/contain no-repeat;
  filter:drop-shadow(0 0 3px rgba(255,255,255,.85)) drop-shadow(0 0 12px rgba(255,255,255,.4));
}

h1{
  width:100%;aspect-ratio:760/62;
  background:var(--title) center/contain no-repeat;
  filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 10px rgba(255,255,255,.8)) drop-shadow(0 0 26px rgba(255,255,255,.45));
  animation:flicker 7s linear infinite;
  overflow:hidden;text-indent:-9999px;white-space:nowrap;
}
.script{
  font-family:var(--f-script);
  font-size:clamp(34px,10vw,46px);
  line-height:1.1;margin-top:calc(2px + 3mm);
  text-shadow:0 0 6px rgba(255,255,255,.85),0 0 20px rgba(255,255,255,.4);
}
.lead{
  font-size:14px;color:var(--dim);letter-spacing:.04em;
  margin:12px auto 24px;max-width:30ch;line-height:1.5;
}
@keyframes flicker{
  0%,18%,22%,62%,64%,100%{opacity:1}
  20%{opacity:.82}
  63%{opacity:.7}
}

/* ---------- кнопки ---------- */
.links{display:grid;gap:12px;list-style:none}
.btn{
  --pad:14px;
  display:grid;grid-template-columns:44px 1fr;align-items:center;gap:14px;
  padding:var(--pad) 16px;
  text-align:left;text-decoration:none;color:var(--ink);
  border:1.5px solid rgba(255,255,255,.85);
  border-radius:16px;
  background:rgba(255,255,255,.015);
  box-shadow:0 0 8px rgba(255,255,255,.35),inset 0 0 10px rgba(255,255,255,.06);
  position:relative;overflow:hidden;
  transition:background .25s,color .25s,box-shadow .25s,transform .2s;
}
.btn::before{ /* бегущий блик */
  content:"";position:absolute;top:0;bottom:0;left:-40%;width:30%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);
  transform:skewX(-20deg);transition:left .7s ease;
}
.btn:hover::before,.btn:focus-visible::before{left:120%}
.btn:hover,.btn:focus-visible{
  background:#fff;color:#111;
  box-shadow:0 0 14px #fff,0 0 38px rgba(255,255,255,.6);
  transform:translateY(-2px) scale(1.012);
  outline:none;
}
.btn:active{transform:scale(.985)}
.btn:focus-visible{outline:2px dashed #fff;outline-offset:4px}
.ico{
  width:44px;height:44px;border-radius:50%;
  border:1.5px solid currentColor;
  display:grid;place-items:center;
  filter:drop-shadow(0 0 4px currentColor);
  transition:filter .25s;
}
.btn:hover .ico,.btn:focus-visible .ico{filter:none}
.ico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.name{display:block;font-size:18px;font-weight:600;letter-spacing:.06em}
.sub{display:block;font-size:13px;opacity:.7;margin-top:2px;word-break:break-all;letter-spacing:.02em}

.foot{

}

@media (max-width:380px){

}
@media (prefers-reduced-motion:reduce){

}
</style>

<script>
(function(){
  var card=document.getElementById('card'),
      stage=document.getElementById('stage'),
      bg=document.getElementById('bg');
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  function move(e){
    var w=innerWidth,h=innerHeight;
    var nx=(e.clientX/w-.5),ny=(e.clientY/h-.5);
    bg.style.setProperty('--px',nx.toFixed(3));
    bg.style.setProperty('--py',ny.toFixed(3));
    bg.querySelectorAll('i').forEach(function(el){
      el.style.setProperty('--px',nx.toFixed(3));
      el.style.setProperty('--py',ny.toFixed(3));
    });
    var r=stage.getBoundingClientRect();
    var cx=(e.clientX-(r.left+r.width/2))/w,cy=(e.clientY-(r.top+r.height/2))/h;
    card.style.setProperty('--ry',(cx*10).toFixed(2)+'deg');
    card.style.setProperty('--rx',(-cy*8).toFixed(2)+'deg');
  }
  function reset(){card.style.setProperty('--rx','0deg');card.style.setProperty('--ry','0deg');}
  addEventListener('pointermove',move,{passive:true});
  document.addEventListener('pointerleave',reset);
  addEventListener('blur',reset);
})();
</script>
