html{background:#000}
body{margin:0;min-height:100vh;background:radial-gradient(120% 60% at 50% 0%,#1d1d22,#000 70%);font-family:'Montserrat',system-ui,sans-serif;color:var(--ink)}
.wrap{--m:calc((100vw - min(410px,100vw - 1cm))/2);--s:min(85px,calc(var(--m)*.7));--g:min(18px,calc((var(--m) - var(--s))/2));--h:calc(var(--s)*.864);overflow-x:clip;min-height:100vh;padding:calc(var(--h) + var(--g)*2 + 24px) .5cm calc(var(--h) + var(--g)*2 + 32px);display:flex;justify-content:center;align-items:center}
.stage{position:relative;width:100%;max-width:410px;--px:0;--py:0}
.bg i{display:block;flex:none;width:var(--s);aspect-ratio:992/857;background:var(--logo) center/contain no-repeat;filter:invert(1)}
.bg b{position:absolute;display:flex;pointer-events:none}
.bg .l,.bg .r{top:0;bottom:0;flex-direction:column;justify-content:space-evenly}
.bg .l{right:calc(100% + var(--g))}
.bg .r{left:calc(100% + var(--g))}
.bg .t,.bg .u{left:0;right:0;justify-content:space-evenly}
.bg .t{bottom:calc(100% + var(--g))}
.bg .u{top:calc(100% + var(--g))}
.bg .c1{right:calc(100% + var(--g));bottom:calc(100% + var(--g))}.bg .c2{left:calc(100% + var(--g));bottom:calc(100% + var(--g))}.bg .c3{right:calc(100% + var(--g));top:calc(100% + var(--g))}.bg .c4{left:calc(100% + var(--g));top:calc(100% + var(--g))}


.card{position:relative;z-index:1;border-radius:30px;padding:30px 22px 32px;background:linear-gradient(150deg,#fff 0%,#e9ebf1 48%,#fff 53%,#dfe2ea 100%);box-shadow:0 0 0 1px #fff,0 20px 55px rgba(0,0,0,.7),0 0 46px rgba(255,255,255,.14),inset 0 2px 0 #fff,inset 0 -16px 32px rgba(120,130,150,.2);transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s ease-out;touch-action:pan-y;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at var(--mx,30%) var(--my,8%),rgba(255,255,255,.95),rgba(255,255,255,0) 52%),linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(23,181,255,.12) 42%,rgba(255,255,255,.95) 50%,rgba(255,77,184,.12) 58%,rgba(255,255,255,0) 70%);background-size:100% 100%,280% 100%;background-position:0 0,var(--sx,15%) 0;background-repeat:no-repeat}
.card>*{position:relative}
.lock{margin:0 5mm}
.lg,.sc,.be{display:block;background-position:center;background-repeat:no-repeat;background-size:contain}
.lg{width:60.67%;margin:0 auto;aspect-ratio:992/857;background-image:var(--logo)}
.sc{width:100%;margin-top:9.3%;aspect-ratio:1635/350;background-image:var(--script)}
.be{width:52.54%;margin:1.83% auto 0;aspect-ratio:859/114;background-image:var(--be)}
.links{display:grid;gap:12px;margin-top:30px}
.btn{--c:var(--pink);position:relative;display:flex;align-items:center;gap:14px;padding:14px 22px;border-radius:999px;border:3px solid var(--ink);background:linear-gradient(180deg,#34343a,#000 55%);color:#fff;text-decoration:none;font-weight:600;font-size:.95rem;overflow:hidden;box-shadow:0 0 14px rgba(23,181,255,.6),0 6px 14px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .2s,box-shadow .2s}
.btn>*{position:relative;z-index:1}
.btn svg{width:22px;height:22px;flex:none;fill:none;stroke:var(--c);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.btn small{margin-left:auto;font-weight:500;font-size:.72rem;color:#cfd2dc}
.btn:hover,.btn:focus-visible,.btn:active{transform:translateY(-2px);outline:none;box-shadow:0 0 24px rgba(23,181,255,.8),0 0 40px rgba(255,77,184,.35),0 8px 16px rgba(0,0,0,.25)}
.b{--c:var(--blue)}.v{--c:var(--violet)}
.order{display:flex;align-items:center;justify-content:center;gap:12px;width:84%;margin:36px auto 0;padding:14px 16px;border-radius:999px;border:3px solid var(--ink);background:linear-gradient(180deg,#34343a,#000 55%);color:#fff;text-decoration:none;box-shadow:0 0 14px rgba(143,91,255,.5),0 6px 14px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .2s,box-shadow .2s}
.order:hover,.order:focus-visible{transform:translateY(-2px);outline:none;box-shadow:0 0 26px rgba(143,91,255,.9),0 0 40px rgba(255,77,184,.4),0 8px 16px rgba(0,0,0,.3)}
.order svg{width:24px;height:24px;flex:none;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.order div{text-align:center}.order em{display:block;font-style:normal;font-size:.68rem;font-weight:600;letter-spacing:.38em;margin-right:-.38em}.order b{display:block;font-size:.9rem;white-space:nowrap;margin-top:2px}.order span{display:block;margin-top:2px;font-size:.72rem;color:#cfd2dc;font-weight:500}
@media(prefers-reduced-motion:reduce){.card,.bg i,.btn,.order{transition:none}}

<script>
(function(){
var card=document.getElementById('card'),stage=document.getElementById('stage');
var still=matchMedia('(prefers-reduced-motion:reduce)').matches,raf=0,X=0,Y=0;
function apply(){raf=0;var r=card.getBoundingClientRect();
var nx=Math.min(1.2,Math.max(-.2,(X-r.left)/r.width)),ny=Math.min(1.2,Math.max(-.2,(Y-r.top)/r.height));
card.style.setProperty('--mx',nx*100+'%');card.style.setProperty('--my',ny*100+'%');card.style.setProperty('--sx',nx*100+'%');
if(still)return;
card.style.setProperty('--rx',((.5-ny)*8)+'deg');card.style.setProperty('--ry',((nx-.5)*8)+'deg');
stage.style.setProperty('--px',nx-.5);stage.style.setProperty('--py',ny-.5);}
function move(x,y){X=x;Y=y;if(!raf)raf=requestAnimationFrame(apply);}
function reset(){['--rx','--ry'].forEach(function(k){card.style.removeProperty(k)});stage.style.setProperty('--px',0);stage.style.setProperty('--py',0);}
addEventListener('pointermove',function(e){move(e.clientX,e.clientY)},{passive:true});
['touchstart','touchmove'].forEach(function(n){addEventListener(n,function(e){var t=e.touches[0];if(t)move(t.clientX,t.clientY)},{passive:true})});
addEventListener('touchend',reset);addEventListener('touchcancel',reset);document.addEventListener('mouseleave',reset);
document.querySelectorAll('[data-soon]').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault()})});
})();
</script>
